[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
exclude = [".venv-win", "docs/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/usage_app", "src/main.py", "src/countdown.py", "src/quota_visual.py", "src/palette_visual.py", "src/run_app.py", "src/configure_accounts.py", "src/repair_config.py"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "usage_app.*"
strict = true
