[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
exclude = [".venv-win", "evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["usage_app", "main.py", "countdown.py", "quota_visual.py", "palette_visual.py", "run_app.py", "configure_accounts.py", "repair_config.py"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "usage_app.*"
strict = true
