name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  daozai:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daozai
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s packaging_tests -v
      - run: rustup toolchain install stable --profile minimal
      - name: Prepare isolated data and run Daozai tests
        shell: pwsh
        run: |
          $env:DAOZAI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'daozai-ci-data'
          New-Item -ItemType Directory -Force -Path $env:DAOZAI_DATA_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE 'Pictures\Screenshots') | Out-Null
          cargo +stable test --locked --all-targets --features record -- --test-threads=1

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/agent_entry_policy.py
      - run: python scripts/check_repository.py

  independent-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v

  today-todo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: today-todo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test test/api.test.js
      - run: node tools/contrast.js

  libretv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretv/source
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - run: npm run build

  published-downloads:
    if: github.event_name == 'push'
    needs: repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_published.py --ref ${{ github.sha }}

  thesis:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: graduation-thesis-workflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  dca-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dca-calculator/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  dca-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dca-calculator/frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dca-calculator/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run build
        env:
          DCA_EXPORT: '1'
